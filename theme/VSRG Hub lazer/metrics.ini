# VSRG Hub lazer: osu!lazer's interface (toolbar, button bar main menu, song info wedge, slanted
# scores, footer, results card) over VSRG Hub osu!, which supplies the plumbing (options, lists,
# collections, noteskins, the gameplay HUD).
[Global]
FallbackTheme=VSRG Hub osu!

[ScreenSelectMusic]
SampleMusicPreviewMode='SampleMusicPreviewMode_Normal'
MusicWheelX=0
MusicWheelY=TW.M(452)

[MusicWheel]
NumWheelItems=13
# lazer's carousel: panels stacked straight down the right side, the selected one pulled out to the
# left and the others leaning back a little the further they are (they fade out under the search box
# and the footer)
ItemTransformFunction=function(self,offset,itemIndex,numItems) local dy = offset*TW.M(78); local a = math.abs(offset); self:x(TW.R(828) + TW.M(6)*math.min(a, 4) - TW.M(60)*math.max(0, 1-a)); self:y(dy); self:diffusealpha(math.max(0, math.min(1, (TW.M(452) + dy - TW.M(150)) / TW.M(60), (TW.M(340) - dy) / TW.M(70)))); end
