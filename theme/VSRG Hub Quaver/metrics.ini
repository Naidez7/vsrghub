# VSRG Hub Quaver: Quaver's interface (top bar, song list with banners, leaderboard, results) over
# VSRG Hub osu!, which supplies the plumbing (options, lists, collections, noteskins).
[Global]
FallbackTheme=VSRG Hub osu!

[ScreenTitleMenu]
# Quaver asks before quitting (BGAnimations/ScreenTitleMenu overlay.lua): the last choice only asks
ChoiceNames="GameStart,Multi,Options,Quit"
ChoiceQuit="text,Exit;lua,QVAskQuit"

[ScreenSelectMusic]
# (the picked map's preview is played by VSRG Hub: the list scrolls without picking, 29 VSRG Hub stable pick.lua)
SampleMusicPreviewMode='SampleMusicPreviewMode_Nothing'
MusicWheelX=0
MusicWheelY=TW.M(441)

[MusicWheel]
NumWheelItems=13
# Quaver's map list: straight rows on the right, the selected one pulled out a little to the left
# (rows fade out where they would run under the top strip and the bottom bar)
ItemTransformFunction=function(self,offset,itemIndex,numItems) self:x(TW.R(556) - TW.M(38)*math.max(0, 1-math.abs(offset))); self:y(TW.M(73.6*offset)); self:diffusealpha(math.max(0, math.min(1, (5 - offset) / 0.7, (offset + 5) / 0.7))); end
