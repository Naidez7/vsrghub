# VSRG Hub osu!: an osu!-style interface drawn from the osu! skin you have selected in osu!.
# Til Death (Etterna's default theme) only supplies the plumbing underneath: screens, options, profiles.
[Global]
FallbackTheme=Til Death

[Common]
# VSRG Hub plays 4K and 7K: Etterna's "dance" game also has 8K doubles, 6K solo and 3K charts, which
# have no notes or skins here; songs with only those are left out of the song list (and those charts
# out of the difficulty lists: TW.playable)
StepsTypesToHide="dance-double,dance-solo,dance-threepanel"

[ScreenInit]
# VSRG Hub's own splash (BGAnimations/ScreenInit background.lua) is shorter than Til Death's
TimerSeconds=2.8

[ScreenTitleMenu]
# (Etterna's own title music off: VSRG Hub plays a random song, Scripts/29 VSRG Hub menumusic.lua)
PlayMusic=false

# osu!'s main menu (drawn and driven by BGAnimations/ScreenTitleMenu overlay.lua; the scroller is hidden)
ChoiceNames="GameStart,Multi,Options,Exit"
ScrollerX=0
ScrollerY=0
ScrollerTransform=function(self,offset,itemIndex,numItems) self:xy(0,0); end
# Options opens VSRG Hub's osu!-style options panel (Scripts/20 VSRG Hub options.lua)
ChoiceOptions="text,Options;lua,TWOpenOptions"

[ScreenProfileLoad]
# (the moment between the menu and song select: the menu's song keeps playing through it)
PlayMusic=false

[ScreenSelectMusic]
MusicWheelX=0
MusicWheelY=TW.M(376)
# osu! stable: the song you picked keeps playing while the list is scrolled; VSRG Hub plays the
# preview itself (Scripts/29 VSRG Hub stable pick.lua)
SampleMusicPreviewMode='SampleMusicPreviewMode_Nothing'

[MusicWheel]
# (enough panels around the list's middle for an open song's difficulties to push the others by
# several places and the list still to show songs while you scroll away from it)
NumWheelItems=25
# osu! stable's carousel (Scripts/27 VSRG Hub stable panels.lua)
ItemTransformFunction=function(self,offset,itemIndex,numItems) TW.stableWheelItem(self, offset) end
ScrollBarOnCommand=visible,false

[MusicWheelItem]
# the panels draw their own text (Graphics/MusicWheelItem Song NormalPart.lua)
SectionExpandedOnCommand=visible,false;zoom,0
SectionCollapsedOnCommand=visible,false;zoom,0
SectionCountOnCommand=visible,false;zoom,0
SortOnCommand=visible,false;zoom,0

[TextBanner]
TitleOnCommand=visible,false
SubtitleOnCommand=visible,false
ArtistOnCommand=visible,false

[ScreenGameplay]
LifeP1OnCommand=visible,false

[ScreenEvaluation]
ShowGraphDisplay=false
ShowComboGraph=false

[ScreenDebugOverlay]
# osu! uses F3 for beatmap options; Etterna's debug menu moves to F10 while VSRG Hub runs
HoldForDebug1="KEY_F10"

[ScreenPlayerOptions]
# osu!'s Overall Difficulty next to Etterna's judge (Scripts/24 VSRG Hub timing.lua)
LineOD="lua,TWOsuOD()"


[ScreenStatsOverlay]
# Etterna's FPS counter, caught so the gameplay HUD's own (movable) counter can stand in for it
StatsOnCommand=%function(self) self:halign(1):valign(0):shadowlength(1):zoom(0.5); TWStatsText = self end
